name: Backfill Historical Release Notes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/backfill-release-notes.yml'

permissions:
  contents: write

jobs:
  backfill:
    name: Rewrite historical release bodies from CHANGELOG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Backfill every published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tempfile

          changelog_path = pathlib.Path("CHANGELOG.md")
          text = changelog_path.read_text(encoding="utf-8")

          heading_re = re.compile(r"^## \[(?P<tag>[^]]+)\](?: - .*)?$", re.MULTILINE)
          matches = list(heading_re.finditer(text))
          sections: dict[str, str] = {}

          for index, match in enumerate(matches):
              end = matches[index + 1].start() if index + 1 < len(matches) else len(text)
              sections[match.group("tag")] = text[match.start():end].strip()

          raw = subprocess.check_output(
              ["gh", "release", "list", "--limit", "100", "--json", "tagName,isDraft"],
              text=True,
          )
          releases = [item for item in json.loads(raw) if not item["isDraft"]]
          tags = [item["tagName"] for item in releases]

          missing = [tag for tag in tags if tag not in sections]
          if missing:
              raise SystemExit(
                  "Refusing partial backfill: CHANGELOG.md has no section for release(s): "
                  + ", ".join(missing)
              )

          footer = """

          ### Installation

          1. Download the Windows x64 ZIP from the **Assets** section below.
          2. Extract the archive.
          3. Run `TarkovNexus.exe`.
          4. Follow the setup wizard on first launch when applicable.

          ### Verification

          When a matching `.sha256` asset is provided, verify the downloaded archive before running it. Current in-app updater releases require the matching checksum before installation.

          ### Links

          - [Project and documentation](https://github.com/ObsidianNetwork/Tarkov-Nexus)
          - [Report issues](https://github.com/ObsidianNetwork/Tarkov-Nexus/issues)
          - [Full changelog](https://github.com/ObsidianNetwork/Tarkov-Nexus/blob/main/CHANGELOG.md)
          """.strip()

          updated: list[str] = []
          with tempfile.TemporaryDirectory() as temp_dir:
              root = pathlib.Path(temp_dir)
              for tag in tags:
                  notes = sections[tag] + "\n\n" + footer + "\n"
                  notes_path = root / (tag.replace("/", "_") + ".md")
                  notes_path.write_text(notes, encoding="utf-8")
                  subprocess.run(
                      ["gh", "release", "edit", tag, "--notes-file", str(notes_path)],
                      check=True,
                  )
                  updated.append(tag)

          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              "## Historical release-note backfill complete\n\n"
              + f"Updated **{len(updated)}** release page(s):\n\n"
              + "\n".join(f"- `{tag}`" for tag in updated)
              + "\n",
              encoding="utf-8",
          )
          PY
