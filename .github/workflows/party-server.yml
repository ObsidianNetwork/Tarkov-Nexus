name: Party Server Image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'party-server/**'
      - '.github/workflows/party-server.yml'
  pull_request:
    branches: [main]
    paths:
      - 'party-server/**'
      - '.github/workflows/party-server.yml'

permissions:
  contents: read
  id-token: write   # OIDC for Depot
  packages: write   # Push to GHCR

jobs:
  test:
    name: Test party-server module
    # ubuntu-latest ships gcc, so CGO_ENABLED=1 works and the go-sqlite3
    # tests (gated behind the `cgo` build tag) actually run. On a dev box
    # without a C toolchain those tests are skipped automatically.
    runs-on: ubuntu-latest
    permissions:
      contents: read   # test job needs neither OIDC nor package push
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: party-server/go.mod
          cache-dependency-path: party-server/go.sum

      # Vet the CGO-enabled path: the build-test workflows vet party-server
      # with CGO_ENABLED=0 (no C toolchain there), which only covers the
      # go-sqlite3 stub. This runner has gcc, so vet the SQLite-backed
      # production code that actually ships.
      - name: Run go vet
        working-directory: party-server
        env:
          CGO_ENABLED: '1'
        run: go vet ./...

      - name: Run tests
        working-directory: party-server
        env:
          # Explicit: go-sqlite3 requires cgo. If a future runner image
          # loses its C toolchain, we want a loud compile failure, not
          # silently skipped storage/hub suites.
          CGO_ENABLED: '1'
        run: go test ./... -race -count=1

  build:
    name: Build & push party-server
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: depot/setup-action@v1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/tarkov-party-server
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: depot/build-push-action@v1
        with:
          # Explicit project ID required: the build context is party-server/
          # but depot.json lives at the repo root, so the action cannot
          # auto-discover the project. OIDC trust is scoped to this project.
          project: jb7r5rcmmv
          context: party-server
          file: party-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
