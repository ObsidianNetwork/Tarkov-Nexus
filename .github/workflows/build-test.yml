name: Build Test

on:
  pull_request:
    branches: [ main, ui-overhaul, Partymode ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'ui-wails/**'
      - 'party-markers.user.js'
      - '.github/workflows/build-test.yml'
  push:
    branches: [ main, ui-overhaul, Partymode ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'ui-wails/**'
      - 'party-markers.user.js'
      - '.github/workflows/build-test.yml'

jobs:
  build-test:
    name: Test Build on Windows
    runs-on: depot-windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ui-wails/frontend/package-lock.json

      # Syntax gate for the shipped userscript. Runs on the Node runtime set up
      # above and is independent of the Go and frontend build ordering below.
      - name: Userscript syntax check
        run: node --check party-markers.user.js

      # Pinned to v2.15.0 to match the wails/v2 requirement in go.mod —
      # installing @latest would let CI drift from the version the app is
      # built and released with.
      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install Go dependencies
        run: go mod download

      - name: Install frontend dependencies
        working-directory: ui-wails/frontend
        run: npm ci

      - name: Verify version consistency
        shell: bash
        run: |
          # Check version.go
          VERSION_GO=$(grep -E '(const|var) Version = ' internal/updater/version.go | sed 's/.*"\(.*\)".*/\1/')
          echo "version.go: $VERSION_GO"

          # Check wails.json
          VERSION_WAILS=$(grep '"productVersion"' ui-wails/wails.json | sed 's/.*"\(.*\)".*/\1/')
          echo "wails.json: $VERSION_WAILS"

          # Validate versions match
          if [ "$VERSION_GO" != "$VERSION_WAILS" ]; then
            echo "⚠️ Warning: Version mismatch detected!"
            echo "version.go: $VERSION_GO"
            echo "wails.json: $VERSION_WAILS"
            echo "Please update both files to match before creating a release."
            exit 1
          fi

          echo "✅ Version consistency check passed: $VERSION_GO"

      # Must run before `go test ./...`: ui-wails/main.go embeds frontend/dist via
      # `//go:embed all:frontend/dist`, so that directory has to exist or every Go
      # package load fails with "pattern all:frontend/dist: no matching files found".
      - name: Build frontend
        working-directory: ui-wails/frontend
        run: npm run build

      # Vet shares go test's embed constraint: it must run after the frontend
      # build so ui-wails/main.go's `//go:embed all:frontend/dist` can load.
      - name: Run go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./... -v

      # party-server is a separate Go module, so the ./... above does not compile
      # it. CGO is disabled so this step does not depend on a C toolchain on the
      # runner: go-sqlite3 then compiles its no-CGO stub, so the DB-free suites
      # (models, plus the hub !cgo mirror) run here while the cgo-tagged
      # SQLite-backed suites (hub_test.go, storage_test.go) are excluded. Those
      # run in party-server.yml's test job with CGO_ENABLED=1; the CGO-enabled
      # build is also exercised by party-server/Dockerfile.
      - name: Run party-server go vet
        working-directory: party-server
        env:
          CGO_ENABLED: '0'
        run: go vet ./...

      - name: Run party-server tests
        working-directory: party-server
        env:
          CGO_ENABLED: '0'
        run: go test ./... -v

      - name: Build application
        working-directory: ui-wails
        run: wails build -platform windows/amd64

      - name: Verify build output
        shell: bash
        run: |
          if [ -f "ui-wails/build/bin/ui-wails.exe" ]; then
            echo "✅ Build successful!"
            ls -lh ui-wails/build/bin/ui-wails.exe
          else
            echo "❌ Build failed - executable not found"
            exit 1
          fi

      - name: Build Summary
        shell: bash
        run: |
          echo "## Build Test Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Build successful" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** Windows x64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          VERSION_GO=$(grep -E '(const|var) Version = ' internal/updater/version.go | sed 's/.*"\(.*\)".*/\1/')
          echo "**Current Version:** $VERSION_GO" >> $GITHUB_STEP_SUMMARY
