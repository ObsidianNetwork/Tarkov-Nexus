name: Deploy to GitHub Pages

on:
  # Runs on pushes to main branch
  push:
    branches: [main]

  # Runs when a new release is published
  release:
    types: [published]

  # Allows manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# The Astro site lives in website/; the repository root is the Go application.
defaults:
  run:
    working-directory: website

jobs:
  refresh-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Release-event deployments can keep serving an older artifact for the same
      # commit. Dispatch from main instead: actions/deploy-pages#383.
      - name: Refresh website from main
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 requires Node >= 22.12
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          # Repository variable, not a secret: the GA4 Measurement ID ships in
          # the public HTML anyway. Settings > Secrets and variables > Actions > Variables.
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
